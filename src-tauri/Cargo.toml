[package]
name = "prompt-stash"
version = "1.0.0"
description = "Prompt Stash — your prompts, organized. Desktop application."
authors = ["Prompt Stash"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "prompt_stash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
