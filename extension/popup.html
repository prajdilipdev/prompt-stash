<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Stash</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app" class="app-container">

    <!-- ======================================================== -->
    <!-- AUTH VIEW                                                -->
    <!-- ======================================================== -->
    <section id="view-auth" class="view hidden">
      <div class="auth-header">
        <div class="logo-mark">
          <svg width="40" height="40" viewBox="0 0 64 64" fill="none">
            <rect x="2" y="2" width="60" height="60" rx="15" fill="#181c2e"/>
            <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
            <path d="M21 20L34 32L21 44" stroke="#a855f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M37 44H47" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
            <path d="M43 14C43 19 45 21 50 21C45 21 43 23 43 28C43 23 41 21 36 21C41 21 43 19 43 14Z" fill="#38bdf8"/>
            <circle cx="43" cy="21" r="1.5" fill="#ffffff"/>
          </svg>
        </div>
        <h1 class="auth-title">Prompt Stash</h1>
        <p class="auth-subtitle">Your prompts, organized. Sign in to sync your vault.</p>
      </div>

      <div class="auth-tabs">
        <button id="auth-tab-signin" class="auth-tab active" type="button">Sign In</button>
        <button id="auth-tab-signup" class="auth-tab" type="button">Sign Up</button>
      </div>

      <div id="auth-error" class="banner-error hidden"></div>
      <div id="auth-success" class="banner-success hidden"></div>

      <form id="auth-form" class="auth-form">
        <div class="form-group">
          <label for="auth-email">Email Address</label>
          <input type="email" id="auth-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" id="auth-submit-btn" class="btn btn-primary btn-block">
          <span class="btn-text">Sign In</span>
          <span class="spinner hidden"></span>
        </button>
      </form>

      <div class="auth-footer">
        <button type="button" id="btn-open-settings-from-auth" class="link-btn">
          ⚙️ Configure Supabase Credentials
        </button>
      </div>
    </section>

    <!-- ======================================================== -->
    <!-- MAIN VAULT VIEW                                          -->
    <!-- ======================================================== -->
    <section id="view-main" class="view hidden">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="brand">
          <svg width="22" height="22" viewBox="0 0 64 64" fill="none">
            <rect x="2" y="2" width="60" height="60" rx="15" fill="#181c2e"/>
            <path d="M21 20L34 32L21 44" stroke="#a855f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M37 44H47" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
            <circle cx="43" cy="21" r="2.5" fill="#38bdf8"/>
          </svg>
          <span class="brand-text">Prompt Stash</span>
        </div>

        <div class="user-actions">
          <span id="user-email-badge" class="user-badge" title="Logged in">user</span>
          <button id="btn-nav-create" class="icon-btn highlight" title="Add Prompt" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <button id="btn-nav-settings" class="icon-btn" title="Settings" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </button>
          <button id="btn-nav-logout" class="icon-btn danger" title="Sign Out" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </button>
        </div>
      </header>

      <!-- Staged prompt notice -->
      <div id="staged-prompt-banner" class="staged-banner hidden">
        <span class="staged-text">✂️ Captured text ready to save</span>
        <button id="btn-review-staged" class="btn btn-xs btn-primary" type="button">Save to Vault</button>
        <button id="btn-discard-staged" class="icon-btn-xs" title="Dismiss" type="button">✕</button>
      </div>

      <!-- Search Bar -->
      <div class="search-container">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" placeholder="Search prompts (keywords, tags, title)..." autofocus autocomplete="off">
        <button id="search-clear-btn" class="search-clear hidden" type="button">✕</button>
      </div>

      <!-- Filter Controls -->
      <div class="filters-row">
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all" type="button">All <span id="count-all" class="count-badge">0</span></button>
          <button class="filter-tab" data-filter="favorites" type="button">★ Starred <span id="count-fav" class="count-badge">0</span></button>
          <button class="filter-tab" data-filter="recent" type="button">Recent</button>
        </div>
      </div>

      <!-- Tags Horizontal Scroll -->
      <div id="tags-bar" class="tags-bar hidden"></div>

      <!-- Prompts Scroll List -->
      <main id="prompt-list" class="prompt-list"></main>

      <!-- Bottom status / open web app bar -->
      <footer class="bottom-bar">
        <a id="link-open-webapp" href="https://prompt-stash1.vercel.app" target="_blank" rel="noopener noreferrer" class="bottom-link">
          Open Full Prompt Stash App ↗
        </a>
      </footer>
    </section>

    <!-- ======================================================== -->
    <!-- CREATE PROMPT VIEW                                       -->
    <!-- ======================================================== -->
    <section id="view-create" class="view hidden">
      <header class="sub-header">
        <button id="btn-back-from-create" class="icon-btn" title="Back" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <h2 class="sub-title">Add New Prompt</h2>
      </header>

      <form id="create-prompt-form" class="editor-form">
        <div class="form-group">
          <label for="create-title">Title *</label>
          <input type="text" id="create-title" placeholder="e.g. Clean Code Refactorer" required maxlength="300">
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="create-content">Prompt Content *</label>
            <span id="create-vars-badge" class="vars-badge hidden">0 variables</span>
          </div>
          <textarea id="create-content" rows="6" placeholder="Write your prompt. Use {{variable_name}} for dynamic inputs..." required></textarea>
        </div>

        <div class="form-group">
          <label for="create-tags">Tags (comma separated)</label>
          <input type="text" id="create-tags" placeholder="coding, refactoring, gpt4">
        </div>

        <div class="form-group">
          <label for="create-desc">Description (optional)</label>
          <input type="text" id="create-desc" placeholder="Brief note about when to use this">
        </div>

        <div class="form-row-checkbox">
          <input type="checkbox" id="create-fav">
          <label for="create-fav">Mark as favorite (★)</label>
        </div>

        <div id="create-error" class="banner-error hidden"></div>

        <div class="form-actions">
          <button type="button" id="btn-cancel-create" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="btn-submit-create" class="btn btn-primary">
            <span class="btn-text">Save to Stash</span>
            <span class="spinner hidden"></span>
          </button>
        </div>
      </form>
    </section>

    <!-- ======================================================== -->
    <!-- SETTINGS VIEW                                            -->
    <!-- ======================================================== -->
    <section id="view-settings" class="view hidden">
      <header class="sub-header">
        <button id="btn-back-from-settings" class="icon-btn" title="Back" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <h2 class="sub-title">Connection Settings</h2>
      </header>

      <form id="settings-form" class="editor-form">
        <div class="form-group">
          <label for="setting-supabase-url">Supabase Project URL</label>
          <input type="url" id="setting-supabase-url" placeholder="https://yourproject.supabase.co" required>
        </div>

        <div class="form-group">
          <label for="setting-supabase-key">Supabase Publishable / Anon Key</label>
          <input type="text" id="setting-supabase-key" placeholder="sb_publishable_... or eyJ..." required>
        </div>

        <div class="form-group">
          <label for="setting-webapp-url">Web App URL</label>
          <input type="url" id="setting-webapp-url" placeholder="https://prompt-stash1.vercel.app" required>
        </div>

        <div id="settings-status" class="banner-success hidden"></div>

        <div class="form-actions">
          <button type="button" id="btn-reset-settings" class="btn btn-secondary">Reset Defaults</button>
          <button type="submit" class="btn btn-primary">Save Settings</button>
        </div>
      </form>
    </section>

  </div>
  <script src="popup.js"></script>
</body>
</html>
